name: Тесты

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # как в Dockerfile
          cache: pip

      - name: Шрифт для предпросмотра слайдов
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest -q
